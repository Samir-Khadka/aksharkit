name: Pages

# Builds the browser playground and publishes it to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits rather than cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs: deploying in the same job as the upload
  # can run before the artifact is listed ("No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # site/ plus pkg/aksharkit.zip (the package source and the playground glue).
      - name: Build the site
        run: python scripts/build_site.py --out _site
      - name: Check the page script
        run: node --check site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
